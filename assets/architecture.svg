<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Claude Code Bridge architecture</title><desc id="d">Claude Web connects through Cloudflare Worker and Durable Object to a local Claude Code MCP server.</desc><rect width="1200" height="420" rx="24" fill="#101827"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#1e293b" stroke="#64748b" stroke-width="2"><rect x="55" y="145" width="220" height="120" rx="16"/><rect x="350" y="145" width="220" height="120" rx="16"/><rect x="645" y="145" width="220" height="120" rx="16"/><rect x="940" y="145" width="220" height="120" rx="16"/></g><g fill="#f8fafc" font-size="24" font-weight="bold"><text x="165" y="195">Claude Web</text><text x="460" y="195">Worker</text><text x="755" y="195">Durable Object</text><text x="1050" y="195">Local Claude</text></g><g fill="#cbd5e1" font-size="15"><text x="165" y="225">Remote MCP</text><text x="460" y="225">HTTPS Gateway</text><text x="755" y="225">WebSocket Hub</text><text x="1050" y="225">MCP over stdio</text></g><g stroke="#38bdf8" stroke-width="4" fill="none"><path d="M275 205H345m-12 -9 12 9-12 9"/><path d="M570 205H640m-12 -9 12 9-12 9"/><path d="M865 205H935m-12 -9 12 9-12 9"/></g><text x="600" y="350" fill="#94a3b8" font-size="18">Local machine initiates an outbound secure connection</text></g></svg>